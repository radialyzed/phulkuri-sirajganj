name: Check for new Phulkuri magazine issue

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6:00 UTC (~12:00 Bangladesh time)
  workflow_dispatch:        # lets you click "Run workflow" manually in the Actions tab

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_magazine.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add issues/ last_issue.json
          git diff --staged --quiet || git commit -m "Update magazine issue"
          git push
